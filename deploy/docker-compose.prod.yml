# Cấu hình Docker Compose cho bản chạy thật Tiên Giới (M4 3.6, Issue #299)
# Tách biệt hoàn toàn với môi trường phát triển (dev). Chạy tại ~/TT/tien-gioi-prod/
# Xem hướng dẫn chi tiết tại docs/VAN_HANH.md
services:
  db:
    image: postgres:16
    container_name: tien-gioi-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=tiengioi
      - POSTGRES_USER=tiengioi
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env.production}
    volumes:
      # Bind-mount thư mục dữ liệu trên máy chủ: dễ sao lưu và bảo trì
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiengioi -d tiengioi"]
      interval: 5s
      timeout: 5s
      retries: 12
    # Cố ý KHÔNG mở cổng ra ngoài: chỉ dịch vụ game truy cập qua mạng nội bộ Docker
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  game:
    image: ghcr.io/nguyencong1227/tien-gioi:${TIEN_GIOI_TAG:?Cần đặt TIEN_GIOI_TAG trong .env.production hoặc môi trường}
    container_name: tien-gioi
    restart: unless-stopped
    init: true # Dùng tini làm PID 1 để chuyển tiếp SIGTERM và dọn tiến trình zombie
    stop_grace_period: 30s # Cho server đủ thời gian lưu toàn bộ dữ liệu người chơi trước khi ngắt
    ports:
      # CHỈ lắng nghe trên loopback 127.0.0.1: Cloudflare Tunnel trỏ vào đây, tuyệt đối không mở 0.0.0.0
      - "127.0.0.1:2567:2567"
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=2567
      - TIEN_GIOI_PROD=1 # Cờ bắt buộc để server cho phép lắng nghe ở cổng 2567
      - STORE=pg
      - DATABASE_URL=postgres://tiengioi:${POSTGRES_PASSWORD}@db:5432/tiengioi
      - AUTH_MODE=account
      - TRUST_PROXY=1 # Tin tưởng proxy Cloudflare Tunnel (1 tầng proxy đặt X-Forwarded-For)
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
