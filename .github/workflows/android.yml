name: Android APK

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Thẻ phiên bản để dựng lại APK (vd v0.1.0)"
        required: true
        type: string

concurrency:
  group: android-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  android-apk:
    name: Dựng gói APK Android (Debug & Release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # `secrets` KHÔNG được phép trong `if:` của bước: GitHub báo "workflow file issue" và không chạy gì
      # (A đo bằng workflow thật trên nhánh tạm, review #315). Tính cờ ở cấp job rồi so `env.HAS_SIGNING_SECRETS`.
      # Giá trị chỉ là true / false, không phải bí mật; bản thân các bí mật chỉ nằm trong `env:` của bước ký.
      HAS_SIGNING_SECRETS: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}

    steps:
      # 1. Xác định thẻ phiên bản: `inputs.tag` (chạy tay) hoặc tên thẻ vừa đẩy.
      # Đưa qua `env` để chặn chèn lệnh shell, kiểm tra định dạng vX.Y.Z[-hậu-tố].
      - name: Xác định và kiểm tra thẻ phiên bản
        id: tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${TAG_INPUT:-$REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Thẻ phiên bản không hợp lệ: '$TAG' (cần vX.Y.Z hoặc vX.Y.Z-rc.1)"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # 2. Luôn checkout ĐÚNG thẻ đã chỉ định
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          # Token có quyền contents: write KHÔNG được nằm trong .git/config khi `npm ci` / Gradle chạy mã bên thứ ba;
          # các bước cần token (`gh release`) tự nhận qua `env:`. fetch-depth 0 đã lấy sẵn origin/main.
          persist-credentials: false

      # 3. Chỉ dựng APK từ commit ĐÃ MERGE trên main
      - name: Kiểm tra thẻ nằm trên main
        run: |
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || { echo "::error::Không có origin/main sau checkout"; exit 1; }
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Commit của thẻ không nằm trên main: chỉ phát hành mã đã merge"
            exit 1
          fi

      # 4. Java 21: dự án Android do Capacitor 8 sinh ra đặt `sourceCompatibility JavaVersion.VERSION_21`
      # (app/android/app/capacitor.build.gradle); Java 17 làm mọi lần dựng lỗi "invalid source release: 21".
      - name: Thiết lập Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 5. Thiết lập Gradle với bộ đệm tự động
      - name: Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v4

      # 6. Môi trường Node.js 22 theo .nvmrc
      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 7. Cài dependencies gốc và build client cho native (chế độ native)
      - name: Cài đặt npm dependencies ở gốc
        run: npm ci

      - name: Build client cho native
        run: npm run build:native -w client

      # 8. Cài dependencies app Capacitor và đồng bộ vào Android
      - name: Cài đặt npm dependencies cho app
        working-directory: app
        run: npm ci

      - name: Đồng bộ sang Android
        working-directory: app
        run: npx cap sync android

      # 9. Cấp quyền thực thi và dựng APK Debug
      - name: Cấp quyền thực thi cho gradlew
        run: chmod +x app/android/gradlew

      - name: Dựng APK Debug
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Chuẩn bị tệp APK Debug và SHA-256
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk "tien-gioi-${TAG_NAME}-debug.apk"
          sha256sum "tien-gioi-${TAG_NAME}-debug.apk" > "tien-gioi-${TAG_NAME}-debug.apk.sha256"
          echo "Mã băm SHA-256 của bản Debug APK:"
          cat "tien-gioi-${TAG_NAME}-debug.apk.sha256"

      # 10. Dựng và ký APK Release (chỉ khi có đủ 4 bí mật ký)
      - name: Dựng và ký APK Release
        if: ${{ env.HAS_SIGNING_SECRETS == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          echo "::add-mask::$KEYSTORE_PASS"
          echo "::add-mask::$KEY_PASS"
          echo "::add-mask::$KEYSTORE_B64"
          echo "::add-mask::$KEY_ALIAS"

          KEYSTORE_FILE="$(mktemp /tmp/keystore.XXXXXX.jks)"
          chmod 600 "$KEYSTORE_FILE"
          trap 'rm -f "$KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_FILE"

          echo "==> Dựng bản release chưa ký với Gradle..."
          (cd app/android && ./gradlew assembleRelease --no-daemon)

          UNSIGNED_APK="app/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            UNSIGNED_APK="app/android/app/build/outputs/apk/release/app-release.apk"
          fi

          echo "==> Căn chỉnh (zipalign) và ký APK bằng apksigner..."
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          ALIGNED_APK="/tmp/tien-gioi-${TAG_NAME}-aligned.apk"
          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK" || cp "$UNSIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass env:KEYSTORE_PASS \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASS \
            --out "tien-gioi-${TAG_NAME}-release.apk" \
            "$ALIGNED_APK"

          rm -f "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify "tien-gioi-${TAG_NAME}-release.apk"
          sha256sum "tien-gioi-${TAG_NAME}-release.apk" > "tien-gioi-${TAG_NAME}-release.apk.sha256"
          echo "Mã băm SHA-256 của bản Release APK:"
          cat "tien-gioi-${TAG_NAME}-release.apk.sha256"

      # 11. Thông báo nếu thiếu bí mật ký APK Release
      - name: Thông báo trạng thái bí mật ký APK
        if: ${{ env.HAS_SIGNING_SECRETS != 'true' }}
        run: |
          echo "::notice::Bí mật ký Android chưa được cấu hình đầy đủ (cần ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD)."
          echo "Chỉ dựng bản Debug APK. Để tạo bản Release APK đã ký, xem hướng dẫn trong docs/APP_ANDROID.md."

      # 12. Tải lên GitHub Actions Artifact
      - name: Tải lên Artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.tag.outputs.tag }}
          path: |
            tien-gioi-*.apk
            tien-gioi-*.sha256
          if-no-files-found: error

      # 13. Đính APK vào GitHub Release nếu bản phát hành đã tồn tại
      - name: Đính APK vào GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.tag.outputs.tag }}
        run: |
          # release.yml (chạy song song cùng thẻ) tạo bản phát hành ở CUỐI job sau khi chạy test: chờ tối đa ~10 phút.
          found=0
          for _ in $(seq 1 20); do
            if gh release view "$TAG_NAME" >/dev/null 2>&1; then found=1; break; fi
            echo "Chưa có GitHub Release $TAG_NAME, chờ 30 giây..."
            sleep 30
          done
          if [ "$found" = 1 ]; then
            echo "Đang đính tệp APK lên GitHub Release $TAG_NAME..."
            gh release upload "$TAG_NAME" tien-gioi-*.apk tien-gioi-*.sha256 --clobber
          else
            echo "::warning::Chưa có GitHub Release cho $TAG_NAME sau ~10 phút. Bỏ qua upload (APK đã lưu ở Actions Artifacts; chạy lại workflow bằng workflow_dispatch khi release đã có)."
          fi
