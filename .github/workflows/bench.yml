name: Bench hằng đêm

on:
  schedule:
    # 21:00 UTC = 04:00 AM giờ Việt Nam
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      time_slack:
        description: "Hệ số nới ngân sách THỜI GIAN của job client-perf (>= 1; số hạt / emitter không nới)"
        required: false
        default: "1.5"

concurrency:
  group: bench-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bench:
    name: Benchmark hiệu năng server
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài đặt dependencies
        run: npm ci

      - name: Chạy Benchmark săn quái (hunt, 20s)
        run: npm run bench -w server -- --seconds 20 --json=bench-hunt.json

      - name: Chạy Benchmark đám đông trong trấn (crowd, 20s)
        run: npm run bench -w server -- --crowd --seconds 20 --json=bench-crowd.json

      - name: So sánh với mốc chuẩn (baseline) và xuất báo cáo
        run: npx tsx server/scripts/bench-compare.ts server/bench-hunt.json server/bench-crowd.json

      - name: Lưu artifact kết quả benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.sha }}
          path: |
            server/bench-hunt.json
            server/bench-crowd.json
          retention-days: 90

  # Hiệu năng client trên "điện thoại" giả lập (Chrome headless, CPU 1x / 4x / 6x), M5.1 #330 tiêu chí 4 + 5.
  # PR chỉ chạy phần tĩnh (check:budget trong ci.yml) để không cạn phút Actions; phần động chạy ở đây hằng đêm + thủ công.
  # Không tự commit gì vào main: kết quả JSON + bảng ma trận chỉ lên artifact.
  client-perf:
    name: Hiệu năng + rò rỉ client (perf:mobile, leak:test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Runner CI chậm hơn máy dev; 1.5 là giá trị khởi đầu, chỉnh sau vài đêm dựa vào bảng trong job summary
      PERF_TIME_SLACK: ${{ inputs.time_slack || '1.5' }}

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài đặt dependencies
        run: npm ci

      - name: Build client (harness phục vụ client/dist)
        run: npm run build

      - name: Đo ma trận kịch bản x bậc đồ hoạ x CPU (thoát mã 1 nếu có kịch bản không đo được)
        id: perf
        # Xoá tệp kết quả CŨ đã commit trong repo (3 dòng, định dạng cũ): nếu bước đo đỏ trước khi ghi tệp mới thì perf-gate
        # báo thẳng "không đọc được kết quả" thay vì đọc nhầm số cũ
        run: |
          rm -f docs/perf-mobile-results.json
          npm run perf:mobile

      - name: So với client/perf-budget.json (đỏ nếu vượt) và ghi job summary
        if: ${{ !cancelled() && steps.perf.outcome != 'skipped' }}
        run: node client/scripts/perf-gate.mjs docs/perf-mobile-results.json

      - name: Kiểm rò rỉ (ra / vào bản đồ, mở / đóng bảng 20 lần)
        if: ${{ !cancelled() }}
        run: npm run leak:test

      - name: Đo thời gian vào thế giới 4G (Fast 4G, Slow 4G, Lạnh & Ấm)
        if: ${{ !cancelled() }}
        run: npm run perf:4g -- --runs=3

      - name: Lưu artifact kết quả hiệu năng client
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: client-perf-results-${{ github.sha }}
          path: |
            docs/perf-mobile-results.json
            docs/HIEU_NANG_DI_DONG.md
          if-no-files-found: warn
          retention-days: 90
