name: E2E hằng đêm

on:
  schedule:
    # 20:00 UTC = 03:00 AM giờ Việt Nam (chạy trước bench.yml lúc 04:00 AM)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Danh sách kịch bản cụ thể cần chạy (ngăn cách bởi dấu phẩy, vd: noi-lai,chat-luong)"
        required: false
        default: ""
      skip:
        description: "Danh sách kịch bản cần bỏ qua (ngăn cách bởi dấu phẩy, vd: map,dpr)"
        required: false
        default: ""
      timeout:
        description: "Thời gian timeout tối đa cho mỗi kịch bản (giây)"
        required: false
        default: "300"
      no_retry:
        description: "Tắt cơ chế thử lại (thất bại ở lần 1 là kết luận ĐỎ ngay)"
        type: boolean
        required: false
        default: false

concurrency:
  group: e2e-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    # Ghi chú khi thay đổi số shard (hiện là 4 shard, từ khi nối 12 check-* vào nightly, #1458): cần cập nhật đồng thời ở 4 vị trí:
    # 1. matrix.shard: [1, 2, 3, 4]
    # 2. name: E2E Shard ${{ matrix.shard }}/4
    # 3. args+=(--shard "${{ matrix.shard }}/4")
    # 4. Job Summary: Kết quả E2E - Shard ${{ matrix.shard }}/4
    name: E2E Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài đặt dependencies
        run: npm ci

      - name: Build client (harness phục vụ client/dist)
        run: npm run build

      - name: Chạy kịch bản E2E Shard ${{ matrix.shard }}/4 (e2e:all)
        id: e2e
        # Ghi chú về GPU:
        # Toàn bộ các kịch bản E2E của Tiên Giới đều dùng getChromeGpuFlags() (server/scripts/e2e-kit.ts).
        # Khi phát hiện biến môi trường CI=true (có sẵn trên GitHub Actions), hệ thống tự động
        # thêm cờ --disable-gpu và lùi về phần mềm rasterization SwiftShader của Chrome.
        # Do đó tất cả kịch bản đều chạy ổn định trên ubuntu-latest mà không cần GPU vật lý.
        # Nếu trong tương lai có kịch bản đòi hỏi GPU phần cứng chuyên dụng, hãy cấu hình --skip
        # kèm lý do kỹ thuật rõ ràng ngay tại đây.
        env:
          # Kịch bản CHẬP CHỜN đã đo hai lượt (cùng đầu main) thì tạm bỏ ở ĐÂY kèm lý do, dạng "tên1,tên2" (tên không có tiền tố e2e:): đừng để đỏ kéo dài che lỗi thật,
          # và mở issue dev-b nói rõ khi nào gỡ (docs/VAN_HANH.md mục 10.3). Hiện: rỗng. Gộp với đầu vào `skip` khi chạy tay.
          NIGHTLY_SKIP: ""
          IN_ONLY: ${{ inputs.only }}
          IN_SKIP: ${{ inputs.skip }}
          IN_TIMEOUT: ${{ inputs.timeout }}
          IN_NO_RETRY: ${{ inputs.no_retry }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/e2e-logs"
          args=(--logs "$GITHUB_WORKSPACE/e2e-logs" --shard "${{ matrix.shard }}/4")

          if [ -n "$IN_ONLY" ]; then
            if [[ ! "$IN_ONLY" =~ ^[a-z0-9:,_-]*$ ]]; then
              echo "Lỗi: input 'only' chứa ký tự không hợp lệ: $IN_ONLY" >&2
              exit 1
            fi
            args+=(--only "$IN_ONLY")
          fi

          skip_all="$NIGHTLY_SKIP"
          if [ -n "$IN_SKIP" ]; then
            skip_all="${skip_all:+$skip_all,}$IN_SKIP"
          fi
          if [ -n "$skip_all" ]; then
            if [[ ! "$skip_all" =~ ^[a-z0-9:,_-]*$ ]]; then
              echo "Lỗi: danh sách skip chứa ký tự không hợp lệ: $skip_all" >&2
              exit 1
            fi
            args+=(--skip "$skip_all")
          fi

          if [ -n "$IN_TIMEOUT" ]; then
            if [[ ! "$IN_TIMEOUT" =~ ^[0-9]+$ ]]; then
              echo "Lỗi: input 'timeout' phải là số nguyên dương: $IN_TIMEOUT" >&2
              exit 1
            fi
            args+=(--timeout "$IN_TIMEOUT")
          fi

          if [ "$IN_NO_RETRY" = "true" ]; then
            args+=(--no-retry)
          fi

          npm run e2e:all -w server -- "${args[@]}"

      - name: Xuất bảng kết quả E2E vào Job Summary
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/e2e-logs/REPORT.md" ]; then
            echo "## 📊 Kết quả E2E - Shard ${{ matrix.shard }}/4" >> $GITHUB_STEP_SUMMARY
            cat "$GITHUB_WORKSPACE/e2e-logs/REPORT.md" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Lưu artifact toàn bộ nhật ký (logs) E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-shard-${{ matrix.shard }}-${{ github.sha }}
          path: ${{ github.workspace }}/e2e-logs/
          if-no-files-found: error
          retention-days: 30
