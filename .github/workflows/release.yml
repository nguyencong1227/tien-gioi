name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Thẻ phiên bản để phát hành lại (vd v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Kiểm thử & Đẩy ảnh Docker lên GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cài đặt dependencies
        run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      - name: Lint mã nguồn
        run: npm run lint

      - name: Kiểm tra định dạng
        run: npx prettier --check .

      - name: Kiểm thử toàn bộ
        run: npm test

      - name: Build client production
        run: npm run build

      - name: Thiết lập Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trích xuất metadata Docker (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nguyencong1227/tien-gioi
          tags: |
            type=semver,pattern={{version}},value=${{ github.ref_name || inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.ref_name || inputs.tag }}
            type=semver,pattern={{major}},value=${{ github.ref_name || inputs.tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ !contains(github.ref_name || inputs.tag, '-rc') && !contains(github.ref_name || inputs.tag, '-beta') && !contains(github.ref_name || inputs.tag, '-alpha') }}
          labels: |
            org.opencontainers.image.title=Tiên Giới
            org.opencontainers.image.description=MMORPG 2D tu tiên Colyseus + Phaser
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build và đẩy ảnh Docker lên GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tạo GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name || inputs.tag }}"
          gh release create "$TAG_NAME" \
            --title "Tiên Giới $TAG_NAME" \
            --generate-notes \
            --verify-tag
