name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      # --if-present: chạy được cả khi nhánh chưa có lint/test (các PR #2, #4 merge sau)
      - name: Lint
        run: npm run lint --if-present

      - name: Kiểm tra định dạng
        run: npx prettier --check .

      - name: Test
        run: npm run test --if-present

      - name: Build client
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tien-gioi:ci .

      # Ảnh chưa từng được CHẠY ở đâu ngoài máy người dùng: kiểm nó khởi động thật, phục vụ client, vào được phòng, tắt êm
      # (docker stop phải kết thúc nhanh: SIGTERM tới được server để lưu nhân vật; bị SIGKILL sau 30 giây là mất dữ liệu).
      - name: Chạy thử ảnh (hàng rào cổng 2567, /health, /metrics, vào phòng, tắt êm)
        run: |
          set -euo pipefail
          # 1. Cổng 2567 mà thiếu TIEN_GIOI_PROD=1: PHẢI từ chối khởi động (dev / test / bot không được chiếm cổng bản chạy thật)
          if timeout 120 docker run --rm tien-gioi:ci > /tmp/khong-co.log 2>&1; then
            echo "::error::Ảnh khởi động ở cổng 2567 mà không có TIEN_GIOI_PROD=1"; cat /tmp/khong-co.log; exit 1
          fi
          grep -q "BẢN CHẠY THẬT" /tmp/khong-co.log
          # 2. Có cờ, như docker-compose (init: true): khởi động
          docker run -d --init --name tg -e TIEN_GIOI_PROD=1 -e METRICS_TOKEN=ci-metrics-token-0123456789 \
            -p 127.0.0.1:2567:2567 tien-gioi:ci
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:2567/health > /tmp/health.json 2>/dev/null && break
            sleep 1
          done
          grep -q '"ok":true' /tmp/health.json
          # 3. /metrics: tắt khi không token, bật với token
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:2567/metrics)" = "401"
          curl -fsS -H "Authorization: Bearer ci-metrics-token-0123456789" "http://127.0.0.1:2567/metrics?format=json" | grep -q '"players"'
          # 4. Phục vụ client đã build
          curl -fsS http://127.0.0.1:2567/ | grep -qi "<html"
          # 5. Vào phòng thật qua matchmaking (tạo phòng Lạc Hà trong ảnh)
          curl -fsS -X POST http://127.0.0.1:2567/matchmake/joinOrCreate/world \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI Chay Thu","secret":"ci_chay_thu_secret_0123456789","v":1}' | grep -q '"sessionId"'
          # 6. Tắt êm THẬT: một người chơi đang nối (tiến trình riêng TRONG container, dùng colyseus.js có sẵn) rồi `docker stop`:
          #    SIGTERM phải tới server để nó lưu nhân vật (mã thoát 143 / thoát tức thì cũng có thể là bị giết mà KHÔNG lưu: chỉ tệp
          #    hồ sơ trên đĩa mới chứng minh được)
          docker exec -d -w /app tg sh -c 'node --input-type=module -e "
            import { Client } from \"colyseus.js\";
            const room = await new Client(\"ws://127.0.0.1:2567\").joinOrCreate(\"world\", { name: \"CI Tat Em\", secret: \"ci_tat_em_secret_0123456789\", v: 1 });
            room.send(\"meditate\", { on: true });
            console.log(\"da vao\", room.sessionId);
            setInterval(() => {}, 1000);
          " > /tmp/vao.log 2>&1'
          for i in $(seq 1 30); do
            docker exec tg grep -q "da vao" /tmp/vao.log 2>/dev/null && break
            sleep 1
          done
          docker exec tg cat /tmp/vao.log
          docker exec tg grep -q "da vao" /tmp/vao.log
          # Đả tọa ~10 giây: tu vi tăng chỉ nằm trong bộ nhớ (hồ sơ lúc vào có exp 0; lưu định kỳ mỗi 30 giây chưa tới), nên tu vi > 0 trên
          # đĩa SAU `docker stop` chứng minh server đã lưu khi nhận SIGTERM
          sleep 10
          start=$(date +%s)
          docker stop -t 30 tg > /dev/null
          took=$(( $(date +%s) - start ))
          code=$(docker inspect -f '{{.State.ExitCode}}' tg)
          echo "docker stop mất ${took}s, mã thoát ${code}"
          test "$took" -lt 25
          test "$code" != "137"
          rm -rf /tmp/players-sau && mkdir /tmp/players-sau
          docker cp tg:/app/data/players/. /tmp/players-sau/
          ls -la /tmp/players-sau
          f=$(grep -l "CI Tat Em" /tmp/players-sau/*.json)
          cat "$f"
          grep -E '"exp": [1-9]' "$f"
          # 7. Log sạch lỗi
          if docker logs tg 2>&1 | grep -E "\[LỖI\]|unhandledRejection|uncaughtException"; then
            echo "::error::Log của ảnh có lỗi"; exit 1
          fi

      - name: Log của ảnh khi thất bại
        if: failure()
        run: docker logs tg 2>&1 | tail -80 || true

  postgres:
    name: PostgreSQL Store Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tien_gioi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Chạy kiểm thử PostgreSQL thật
        run: |
          if [ -d server/src/pg ]; then
            npx vitest run server/src/pg server/src/rooms/WorldRoom.pg.test.ts
            mkdir -p /tmp/tg-mig-src
            STORE=pg DATABASE_URL=$TEST_DATABASE_URL npm run chuyen-du-lieu -w server -- --thu --dir=/tmp/tg-mig-src
          else
            echo "Chưa có server/src/pg trên nhánh này, bỏ qua."
          fi
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/tien_gioi_test
