name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Kiểm tra kiểu
        run: npm run typecheck

      # --if-present: chạy được cả khi nhánh chưa có lint/test (các PR #2, #4 merge sau)
      - name: Lint
        run: npm run lint --if-present

      - name: Kiểm tra định dạng
        run: npx prettier --check .

      - name: Test
        run: npm run test --if-present

      - name: Build client
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build .

  postgres:
    name: PostgreSQL Store Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tien_gioi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Chạy kiểm thử PostgreSQL thật
        run: |
          if [ -d server/src/pg ]; then
            npx vitest run server/src/pg server/src/rooms/WorldRoom.pg.test.ts
            mkdir -p /tmp/tg-mig-src
            STORE=pg DATABASE_URL=$TEST_DATABASE_URL npm run chuyen-du-lieu -w server -- --thu --dir=/tmp/tg-mig-src
          else
            echo "Chưa có server/src/pg trên nhánh này, bỏ qua."
          fi
        env:
          TEST_DATABASE_URL: postgres://postgres:password@localhost:5432/tien_gioi_test
